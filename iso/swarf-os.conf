# Anaconda profile for swarf-os. Anaconda matches it on the os-release of the live system
# (ID=fedora, VARIANT_ID=custom, see build/configure.sh). fedora-kde hides the user, password
# and date/time pages: accounts are created by Plasma Setup at first boot (SPEC.md).
[Profile]
profile_id = swarf-os
base_profile = fedora-kde

[Profile Detection]
os_id = fedora
variant_id = custom

# bootc's Anaconda payload empties the physical root and does not rebind a separate /var or /home
# (installer failed with "mount --bind /mnt/sysimage/var ... does not exist"): keep a single
# btrfs root, ostree puts /var and /home (/var/home) inside it.
[Storage]
default_partitioning =
    /     (min 1 GiB)

# No geolocation (no telemetry, docs/adr/0026): the installer would send the IP address to
# geoip.fedoraproject.org to preselect language, keyboard and time zone.
[Timezone]
geolocation_provider =

[Localization]
use_geolocation = False
