name: build

# Daily: build, check, publish :testing, boot test, then :stable (same digest) or a drift pull
# request. Pull requests from this repository only build, check and boot test (no push, no
# issue): they answer "does CI still work". All logic lives in tools/.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Fork pull requests have no KVM, no secrets and no package rights.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      pull-requests: write
      issues: write
      actions: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the runner
        run: |
          echo "WORK=$RUNNER_TEMP/ci" >>"$GITHUB_ENV"
          tools/ci-runner-setup.sh

      - name: Build
        run: tools/ci-build.sh localhost/swarf-os:ci

      - name: Check the image (blacklist, kernel signature, crypt, manifest)
        id: check
        run: |
          set +e
          BASE_DIGEST=$(cat "$WORK/base-digest") tools/manifest-check.sh localhost/swarf-os:ci
          rc=$?
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || [ "$rc" = 10 ]

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish :testing and the dated tag
        id: publish
        if: env.PUBLISH == 'true'
        run: echo "digest=$(tools/publish.sh localhost/swarf-os:ci | tail -1)" >>"$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "ghcr.io/swarf-os/image@${{ steps.publish.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ghcr.io/swarf-os/image
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: env.PUBLISH == 'true'
        with:
          image: ghcr.io/swarf-os/image@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Slim the SBOM (rpm packages only, no file list; the attestation limit is 16 MiB)
        if: env.PUBLISH == 'true'
        run: |
          jq -c '
            ([.packages[] | select(any(.externalRefs[]?; .referenceType == "purl" and (.referenceLocator | startswith("pkg:rpm/")))) | .SPDXID]) as $keep
            | del(.files)
            | .packages |= map(select(.SPDXID as $i | $keep | index($i)))
            | .relationships |= map(select(.relationshipType == "DESCRIBES" or ((.spdxElementId as $a | .relatedSpdxElement as $b | ($keep | index($a)) and ($keep | index($b))))))
          ' sbom.spdx.json >sbom.slim.json
          mv sbom.slim.json sbom.spdx.json
          ls -l sbom.spdx.json

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ghcr.io/swarf-os/image
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Boot test
        run: |
          image=localhost/swarf-os:ci
          [ "$PUBLISH" = true ] && image="ghcr.io/swarf-os/image@${{ steps.publish.outputs.digest }}"
          tools/boot-test.sh "$image"

      - name: Promote to :stable (same digest)
        if: env.PUBLISH == 'true' && steps.check.outputs.rc == '0'
        run: tools/promote.sh "${{ steps.publish.outputs.digest }}"

      - name: Drift pull request (:stable waits)
        if: env.PUBLISH == 'true' && steps.check.outputs.rc == '10'
        run: tools/drift-pr.sh "${{ steps.publish.outputs.digest }}"

      - name: Close the drift issue
        if: env.PUBLISH == 'true' && success()
        run: tools/drift-issue.sh ok

      - name: Open or update the drift issue
        if: env.PUBLISH == 'true' && failure()
        run: |
          log=$WORK/boot-test.log
          [ -s "$log" ] || log=$WORK/build.log
          tools/drift-issue.sh fail "The daily pipeline failed; :stable stays on the previous image." "$log"

      - name: Keep the schedule enabled (ADR 0017)
        if: github.event_name == 'schedule' && success()
        continue-on-error: true
        run: gh workflow enable build.yml

      - name: Retention
        if: github.event_name == 'schedule' && success()
        run: tools/prune.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs
          path: |
            ${{ runner.temp }}/ci/*.log
            ${{ runner.temp }}/ci/manifest-diff.txt
          if-no-files-found: ignore
